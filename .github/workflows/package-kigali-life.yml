name: Package Kigali Life
on:
  push:
    paths:
      - 'kigali-life/**'
      - '.github/workflows/package-kigali-life.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: zip -r Kigali-Life-Current-Build.zip kigali-life
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kigali-Life-Current-Build
          path: Kigali-Life-Current-Build.zip
